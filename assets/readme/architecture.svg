<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ProLogic System Architecture and Pipeline</title>
  <desc id="arch-desc">Tri-pillar architecture of ProLogic: Simulation Engine Core, Universal CAD Interoperability Layer, and Fluent WinUI 3 Workbench.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b2d" />
      <stop offset="100%" stop-color="#09111e" />
    </linearGradient>

    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161530" />
      <stop offset="100%" stop-color="#0c0b1e" />
    </linearGradient>

    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2136" />
      <stop offset="100%" stop-color="#0a1524" />
    </linearGradient>

    <!-- Pipeline Connectors -->
    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#38bdf8" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="28" ry="28" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect width="1200" height="320" rx="28" ry="28" fill="url(#archGrid)" />

  <!-- ===================================================================== -->
  <!-- SUBSYSTEM 1: SIMULATION ENGINE CORE                                   -->
  <!-- ===================================================================== -->
  <g id="subsystem-1" transform="translate(48, 28)">
    <rect width="340" height="248" rx="18" ry="18" fill="url(#cardBg1)" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)" />
    
    <!-- Top Subsystem Tag -->
    <g transform="translate(18, 18)">
      <rect width="140" height="24" rx="12" fill="#062e2a" stroke="#00f5d4" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#00f5d4" filter="url(#archGlow)" />
      <text x="24" y="17" fill="#00f5d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">ENGINE CORE</text>
    </g>

    <!-- Subsystem Heading (Essential >= 20 units) -->
    <text x="18" y="74" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Simulation Engine</text>
    <text x="18" y="96" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Discrete 3-Valued Multi-Logic</text>

    <!-- Feature Items (Supporting >= 18 units) -->
    <g transform="translate(18, 126)">
      <circle cx="5" cy="5" r="3.5" fill="#00f5d4" />
      <text x="16" y="9" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Multi-Valued: 0, 1, and Hi-Z</text>

      <circle cx="5" cy="33" r="3.5" fill="#00f5d4" />
      <text x="16" y="37" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Event-Driven Propagation Queue</text>

      <circle cx="5" cy="61" r="3.5" fill="#00f5d4" />
      <text x="16" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Tri-State Contention Resolution</text>

      <circle cx="5" cy="89" r="3.5" fill="#00f5d4" />
      <text x="16" y="93" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Sub-Cycle Oscillation Damping</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- PIPELINE CONNECTOR 1 -> 2                                             -->
  <!-- ===================================================================== -->
  <g id="connector-1-2" transform="translate(388, 140)">
    <line x1="0" y1="12" x2="42" y2="12" stroke="url(#flow1)" stroke-width="3" />
    <polygon points="36,6 44,12 36,18" fill="#a78bfa" />
    <circle cx="21" cy="12" r="4" fill="#00f5d4" filter="url(#archGlow)" />
  </g>

  <!-- ===================================================================== -->
  <!-- SUBSYSTEM 2: UNIVERSAL CAD INTEROPERABILITY                           -->
  <!-- ===================================================================== -->
  <g id="subsystem-2" transform="translate(430, 28)">
    <rect width="340" height="248" rx="18" ry="18" fill="url(#cardBg2)" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)" />
    
    <!-- Top Subsystem Tag -->
    <g transform="translate(18, 18)">
      <rect width="138" height="24" rx="12" fill="#261b40" stroke="#a78bfa" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#a78bfa" filter="url(#archGlow)" />
      <text x="24" y="17" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">CAD INTEROP</text>
    </g>

    <!-- Subsystem Heading (Essential >= 20 units) -->
    <text x="18" y="74" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">CAD Interoperability</text>
    <text x="18" y="96" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Universal Multi-Format Layer</text>

    <!-- Feature Items (Supporting >= 18 units) -->
    <g transform="translate(18, 126)">
      <circle cx="5" cy="5" r="3.5" fill="#a78bfa" />
      <text x="16" y="9" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Native Deflate: .plgc, .plgclib</text>

      <circle cx="5" cy="33" r="3.5" fill="#a78bfa" />
      <text x="16" y="37" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Logicly: .logicly, .logiclylib, .xml</text>

      <circle cx="5" cy="61" r="3.5" fill="#a78bfa" />
      <text x="16" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Logisim (.circ) &amp; Digital (.dig)</text>

      <circle cx="5" cy="89" r="3.5" fill="#a78bfa" />
      <text x="16" y="93" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">CircuitVerse &amp; SimcirJS Formats</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- PIPELINE CONNECTOR 2 -> 3                                             -->
  <!-- ===================================================================== -->
  <g id="connector-2-3" transform="translate(770, 140)">
    <line x1="0" y1="12" x2="42" y2="12" stroke="url(#flow2)" stroke-width="3" />
    <polygon points="36,6 44,12 36,18" fill="#38bdf8" />
    <circle cx="21" cy="12" r="4" fill="#38bdf8" filter="url(#archGlow)" />
  </g>

  <!-- ===================================================================== -->
  <!-- SUBSYSTEM 3: FLUENT WINUI 3 WORKBENCH                                 -->
  <!-- ===================================================================== -->
  <g id="subsystem-3" transform="translate(812, 28)">
    <rect width="340" height="248" rx="18" ry="18" fill="url(#cardBg3)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)" />
    
    <!-- Top Subsystem Tag -->
    <g transform="translate(18, 18)">
      <rect width="144" height="24" rx="12" fill="#0b2c48" stroke="#38bdf8" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#38bdf8" filter="url(#archGlow)" />
      <text x="24" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">WINUI 3 CAD</text>
    </g>

    <!-- Subsystem Heading (Essential >= 20 units) -->
    <text x="18" y="74" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Fluent Workbench</text>
    <text x="18" y="96" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Reactive Desktop Workspace</text>

    <!-- Feature Items (Supporting >= 18 units) -->
    <g transform="translate(18, 126)">
      <circle cx="5" cy="5" r="3.5" fill="#38bdf8" />
      <text x="16" y="9" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">60 FPS Infinite Vector Canvas</text>

      <circle cx="5" cy="33" r="3.5" fill="#38bdf8" />
      <text x="16" y="37" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Orthogonal 90° Routing &amp; Snaps</text>

      <circle cx="5" cy="61" r="3.5" fill="#38bdf8" />
      <text x="16" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Custom IC Packaging &amp; Catalog</text>

      <circle cx="5" cy="89" r="3.5" fill="#38bdf8" />
      <text x="16" y="93" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">2x High-DPI PNG Schematic Export</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM BUS BAR                                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(48, 290)">
    <line x1="0" y1="0" x2="1104" y2="0" stroke="#1e293b" stroke-width="1.2" />
    <text x="552" y="18" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">HIGH-SPEED SIMULATION PIPELINE  ·  REAL-TIME PROPAGATION  ·  UNIVERSAL CAD INTEROPERABILITY</text>
  </g>
</svg>
